<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>甲蟲管理小幫手</title><style>
:root{font-family:system-ui,-apple-system,'Noto Sans TC',sans-serif;color:#19352b;background:#f2f6f1}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1050px;margin:auto;padding:16px}header{background:#173e32;color:white;padding:22px;border-radius:18px}header small{color:#b9d9c9}nav{display:flex;gap:6px;overflow:auto;padding:12px 0}button{cursor:pointer;font:inherit}nav button,.secondary{border:1px solid #b9cfc1;background:white;color:#234b39;padding:10px 12px;border-radius:10px;white-space:nowrap}.active,.primary{background:#1e6650!important;color:white!important;border:1px solid #1e6650!important;padding:10px 13px;border-radius:10px}main{background:white;border-radius:16px;padding:18px;min-height:400px}h1{margin:3px 0;font-size:25px}h2{margin:0 0 14px;font-size:21px}h3{margin:5px 0 10px}p{line-height:1.6}.muted{color:#62796c;font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.card{border:1px solid #d6e4d8;border-radius:12px;padding:14px;margin:10px 0}.soft{background:#f2f8f3}.tag{display:inline-block;background:#e2efe7;color:#245d42;border-radius:15px;padding:4px 9px;font-size:12px}.stat{font-size:24px;font-weight:750}label{display:block;font-weight:650;font-size:13px;margin:12px 0 4px}input,select,textarea{font:inherit;width:100%;border:1px solid #bdcfc1;border-radius:9px;padding:10px;background:#fff;color:#19352b}input[type=checkbox]{width:auto}button{margin:3px 3px 3px 0}.actions{margin-top:14px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}table{border-collapse:collapse;width:100%;font-size:13px}th,td{border-bottom:1px solid #d6e4d8;padding:9px 5px;text-align:left}.scroll{overflow:auto}.notice{border-left:4px solid #d5a64e;padding:12px;background:#fff8e9;margin:10px 0}.paper{background:#fff;color:#111;border:1px dashed #777;max-width:600px;padding:16px;font-family:Arial,sans-serif}.paper th,.paper td{border:1px solid #888;padding:7px;font-size:12px}.box{display:inline-block;width:17px;height:17px;border:1px solid #333}.hide{display:none}footer{color:#607568;font-size:12px;margin:14px 0;text-align:center}@media print{body{background:white}.wrap>*:not(main),main>*:not(#printTarget){display:none!important}main{padding:0}#printTarget{display:block!important}.paper{border:0;max-width:100%}}@media(max-width:480px){.wrap{padding:8px}main{padding:12px}h1{font-size:22px}}
</style></head><body><div class="wrap"><header><small>BEETLE KEEPER · OFFLINE PROTOTYPE</small><h1>🪲 甲蟲管理小幫手</h1><div>先計畫 → 幼蟲入庫 → 建立批次 → 換土／羽化 → 成果分析</div></header><nav id="nav"></nav><main id="main"></main><footer>離線互動原型｜資料儲存在此瀏覽器｜請定期匯出 JSON 備份｜非正式雲端系統</footer></div><script>
(()=>{'use strict';const KEY='beetle_keeper_v1';let state={plans:[],stock:[],batches:[]},tab='home',view='',current='',selectedLabel='';try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.plans)&&Array.isArray(s.stock)&&Array.isArray(s.batches))state=s}catch(e){}const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),today=()=>new Date().toLocaleDateString('en-CA'),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6),save=()=>{localStorage.setItem(KEY,JSON.stringify(state));render()},plus=(d,n)=>{let x=new Date(d+'T12:00:00');x.setDate(x.getDate()+Number(n));return x.toLocaleDateString('en-CA')},fmt=d=>d||'未設定',money=n=>'NT$ '+Number(n||0).toLocaleString('zh-TW'),by=(arr,id)=>arr.find(x=>x.id===id),link=(action,id,label)=>`<button class="secondary" data-action="${action}" data-id="${esc(id)}">${label}</button>`;
const stages=['卵','L1','L2','L3','前蛹','蛹','成蟲'];function header(t,sub=''){return `<h2>${t}</h2>${sub?`<p class="muted">${sub}</p>`:''}`}function field(label,name,type='text',value='',extra=''){return `<label>${label}</label><input name="${name}" type="${type}" value="${esc(value)}" ${extra}>`};function form(html,id,button){return `<form id="${id}">${html}<div class="actions"><button class="primary" type="submit">${button}</button><button type="button" class="secondary" data-action="cancel">返回</button></div></form>`}
function render(){const nav=[['home','工作台'],['plans','飼育計畫'],['stock','幼蟲入庫'],['batches','飼育批次'],['events','換土／羽化'],['labels','貼紙'],['results','成果／備份']];$('#nav').innerHTML=nav.map(([k,v])=>`<button class="${tab===k?'active':''}" data-tab="${k}">${v}</button>`).join('');let h='';
if(view==='newPlan'){h=header('新增飼育計畫','先建立自己的 SOP，後續批次才可套用。')+form(field('計畫名稱／品種','name','text','','required')+field('版本','version','text','V1','required')+field('預估蛹期（天）','pupa','number',40,'min="1" required')+field('介質單價（元／L）','price','number',20,'min="0" step="0.01" required')+field('填充率（%）','fill','number',140,'min="1" required')+field('人工時薪（元）','wage','number',250,'min="0" required')+`<div class="notice">飼育階段每行一筆：階段,換土間隔天數,容器cc,溫度°C,性別（共用/公/母）。<br>第一行的間隔天數通常填 0；其他階段依上一次換土日期往後推。</div><label>飼育階段（可自行增減行）</label><textarea name="steps" rows="8" required> L1,0,500,22,共用\nL3,60,1500,16,公\nL3,90,1500,16,公\nL3,60,1000,22,母</textarea>`,'newPlan','儲存飼育計畫')}
else if(view==='newStock'){h=header('登記幼蟲取得／入庫')+form(field('品種','species','text','','required')+field('取得日期','date','date',today(),'required')+field('來源','source','text','')+field('數量（隻）','count','number',100,'min="1" required')+field('每隻購入成本（元）','unit','number',100,'min="0" step="0.01" required'),'newStock','完成入庫')}
else if(view==='newBatch'){const options=state.plans.map(p=>`<option value="${p.id}">${esc(p.name)} ${esc(p.version)}</option>`).join(''),stockOptions=state.stock.filter(s=>s.count-s.used>0).map(s=>`<option value="${s.id}">${esc(s.species)}｜可用 ${s.count-s.used} 隻｜${esc(s.source)}</option>`).join('');h=header('建立飼育批次','必須選擇已儲存的計畫及有可用數量的入庫紀錄。')+form(`<label>套用飼育計畫</label><select name="plan">${options}</select><label>選擇幼蟲入庫紀錄</label><select name="stock">${stockOptions}</select>`+field('批次編號','code','text','B-'+String(state.batches.length+1).padStart(3,'0'),'required')+field('批次開始日期','start','date',today(),'required')+field('投入幼蟲數量','count','number',50,'min="1" required')+`<label>目前性別狀態</label><select name="sex"><option>未分公母</option><option>公</option><option>母</option></select>`,'newBatch','建立批次並生成排程')}
else if(view==='detail'){const b=by(state.batches,current);if(!b){view='';render();return}const p=b.planSnapshot;h=header(`${esc(b.code)}｜${esc(b.species)}`,`套用 ${esc(p.name)} ${esc(p.version)}｜目前 ${esc(b.stage)}｜${esc(b.sex)}`)+`<div class="grid"><div class="card soft">目前存活<div class="stat">${b.alive} 隻</div></div><div class="card soft">初始數量<div class="stat">${b.initial} 隻</div></div><div class="card soft">預估成本<div class="stat">${money(b.estimate)}</div></div></div><h3>預定換土排程</h3><div class="scroll"><table><tr><th>日期</th><th>階段</th><th>容器</th><th>溫度</th><th>性別</th></tr>${b.schedule.map(s=>`<tr><td>${fmt(s.date)}</td><td>${esc(s.stage)}</td><td>${s.cc}cc</td><td>${s.temp}°C</td><td>${esc(s.sex)}</td></tr>`).join('')}</table></div><h3>已完成紀錄</h3>${b.history.length?b.history.map(x=>`<div class="card">${esc(x.type)}｜${fmt(x.date)} ${x.type==='換土'?`｜存活 ${x.alive}／死亡 ${x.dead}｜重量 ${x.weight?esc(x.weight)+'g':'未輸入'}`:''}</div>`).join(''):'<p class="muted">尚無紀錄。現場可先手寫貼紙，之後再回填。</p>'}<div class="actions">${link('record',b.id,'回填換土')}${link('pupate',b.id,'登記化蛹')}${link('emerge',b.id,'登記羽化')}${link('sizes',b.id,'成蟲尺寸')}${link('label',b.id,'預覽貼紙')}${link('sex',b.id,'分公母／個體編號')}</div>`}
else if(['record','pupate','emerge','sizes','sex'].includes(view)){const b=by(state.batches,current);if(!b){view='';render();return}if(view==='record')h=header('換土事後回填',`${esc(b.code)}｜現場先寫貼紙，回來再登記。`)+form(field('實際換土日期','date','date',today(),'required')+field('存活隻數（必填）','alive','number',b.alive,`min="0" max="${b.alive}" required`)+field('死亡隻數（必填）','dead','number',0,`min="0" max="${b.alive}" required`)+field('重量 g（選填；可只留在貼紙）','weight','number','','min="0" step="0.01"')+`<div class="notice">不必輸入實際介質用量。完成後，相對排程依實際換土日重算。</div>`,'record','儲存換土紀錄');
if(view==='pupate')h=header('化蛹登記',`${esc(b.code)}｜化蛹後停止幼蟲換土提醒。`)+form(field('發現化蛹日期','date','date',today(),'required')+field('預估蛹期（天）','days','number',b.planSnapshot.pupa,'min="1" required'),'pupate','開始羽化追蹤');
if(view==='emerge')h=header('羽化登記',esc(b.code))+form(field('實際羽化日期','date','date',today(),'required')+field('實際羽化數量','count','number',b.alive,`min="0" max="${b.alive}" required`),'emerge','登記羽化完成');
if(view==='sizes')h=header('成蟲尺寸快速輸入',`${esc(b.code)}｜單位 mm，僅統計有實際輸入的個體。`)+form(`<label>公蟲尺寸（逗號、空格或換行分隔）</label><textarea name="male" rows="4">${esc(b.male.join(', '))}</textarea><label>母蟲尺寸（逗號、空格或換行分隔）</label><textarea name="female" rows="4">${esc(b.female.join(', '))}</textarea>`,'sizes','儲存尺寸');
if(view==='sex')h=header('分公母與個體編號',`${esc(b.code)}｜分公母前共用批次貼紙，分完後每隻個體一張。`)+form(field('公蟲數量','male','number',Math.floor(b.alive/2),'min="0" required')+field('母蟲數量','female','number',Math.ceil(b.alive/2),'min="0" required')+`<div class="notice">此原型可生成每隻獨立編號與貼紙選項；個體獨立換土／重量歷史管理會在正式版完善。</div>`,'sex','建立個體編號');}
else if(tab==='home'){const due=state.batches.filter(b=>b.stage!=='蛹'&&b.stage!=='成蟲'&&b.schedule.length);const pupae=state.batches.filter(b=>b.stage==='蛹');h=header('今日工作台','依飼育生命週期顯示工作，不需要在換土現場一直操作手機。')+`<div class="grid"><div class="card soft">飼育計畫<div class="stat">${state.plans.length}</div></div><div class="card soft">入庫紀錄<div class="stat">${state.stock.length}</div></div><div class="card soft">飼育批次<div class="stat">${state.batches.length}</div></div></div>`+(state.plans.length===0?`<div class="notice">第一步：先建立飼育計畫，之後才能入庫、建立批次及換土。</div><button class="primary" data-action="newPlan">＋ 建立第一份飼育計畫</button>`:state.stock.length===0?`<div class="notice">第二步：已有飼育計畫，接著登記幼蟲取得。</div><button class="primary" data-action="newStock">＋ 登記幼蟲入庫</button>`:state.batches.length===0?`<div class="notice">第三步：選擇計畫與入庫紀錄，建立飼育批次。</div><button class="primary" data-action="newBatch">＋ 建立第一個批次</button>`:'')+`<h3>換土排程</h3>${due.map(b=>`<div class="card row"><span><b>${esc(b.code)}</b>｜${esc(b.species)}<br><span class="muted">下一次：${fmt(b.schedule[0].date)}</span></span>${link('record',b.id,'事後回填')}</div>`).join('')||'<p class="muted">暫無換土排程</p>'}<h3>羽化觀察</h3>${pupae.map(b=>`<div class="card row"><span><b>${esc(b.code)}</b>｜${esc(b.species)}<br><span class="muted">預估羽化：${fmt(plus(b.pupated,b.pupaDays))}</span></span>${link('emerge',b.id,'登記羽化')}</div>`).join('')||'<p class="muted">暫無蛹期個體</p>'}`}
else if(tab==='plans'){h=header('我的飼育計畫','每個人建立自己的 SOP，可重複套用不同批次；批次建立後保留當時版本快照。')+`<button class="primary" data-action="newPlan">＋ 新增飼育計畫</button>`+state.plans.map(p=>`<div class="card"><div class="row"><b>${esc(p.name)}</b><span class="tag">${esc(p.version)}</span></div><p class="muted">${p.steps.length} 個階段｜蛹期 ${p.pupa} 天｜介質 ${money(p.price)}/L｜填充率 ${p.fill}%</p><div class="scroll"><table><tr><th>階段</th><th>間隔</th><th>容器</th><th>溫度</th><th>性別</th></tr>${p.steps.map(s=>`<tr><td>${esc(s.stage)}</td><td>${s.days} 天</td><td>${s.cc}cc</td><td>${s.temp}°C</td><td>${esc(s.sex)}</td></tr>`).join('')}</table></div></div>`).join('')+(state.plans.length?'':'<p class="muted">尚未建立任何飼育計畫。</p>')}
else if(tab==='stock'){h=header('幼蟲取得／入庫','有入庫數量，才可以建立正式飼育批次。')+`<button class="primary" data-action="newStock">＋ 新增入庫紀錄</button>`+state.stock.map(s=>`<div class="card"><b>${esc(s.species)}</b><p class="muted">${fmt(s.date)}｜${esc(s.source)}｜每隻 ${money(s.unit)}</p><span class="tag">入庫 ${s.count}｜已分配 ${s.used}｜剩餘 ${s.count-s.used}</span></div>`).join('')}
else if(tab==='batches'){h=header('飼育批次','每個批次都必須綁定飼育計畫和入庫紀錄。')+`<button class="primary" data-action="newBatch" ${(!state.plans.length||!state.stock.some(s=>s.count>s.used))?'disabled title="請先建立計畫並登記有剩餘數量的入庫資料"':''}>＋ 新增批次</button>`+state.batches.map(b=>`<div class="card"><div class="row"><b>${esc(b.code)}｜${esc(b.species)}</b><span class="tag">${esc(b.stage)}</span></div><p class="muted">${esc(b.planSnapshot.name)} ${esc(b.planSnapshot.version)}｜${esc(b.sex)}｜存活 ${b.alive}/${b.initial}</p>${link('detail',b.id,'管理此批次')}</div>`).join('')}
else if(tab==='events'){h=header('換土／化蛹／羽化','現場可手寫貼紙，事後回填；沒有批次就無法記錄。')+state.batches.map(b=>`<div class="card"><b>${esc(b.code)}｜${esc(b.species)}</b><p class="muted">${esc(b.stage)}｜存活 ${b.alive} 隻</p>${link('record',b.id,'換土回填')}${link('pupate',b.id,'化蛹')}${link('emerge',b.id,'羽化')}${link('sizes',b.id,'成蟲尺寸')}</div>`).join('')}
else if(tab==='labels'){h=header('飼育貼紙','過去完成紀錄＋未來排程＋手寫欄位。分公母後可選每隻獨立貼紙。');if(state.batches.length){let options=state.batches.flatMap(b=>[{value:b.id,label:b.code+'｜批次共用貼紙'},...(b.individuals||[]).map(x=>({value:b.id+'::'+x,label:x+'｜個體貼紙'}))]);if(!options.some(o=>o.value===selectedLabel))selectedLabel=options[0].value;h+=`<label>選擇批次／個體</label><select id="labelSelect">${options.map(o=>`<option value="${esc(o.value)}" ${selectedLabel===o.value?'selected':''}>${esc(o.label)}</option>`).join('')}</select>`+labelHtml(selectedLabel)+`<button class="primary" data-action="print">列印貼紙（瀏覽器）</button><p class="muted">QR 連結與實體藍牙標籤機尚未接入，正式版依設備型號整合。</p>`}else h+='<p class="muted">尚無批次，不能產生正式飼育貼紙。</p>'}
else if(tab==='results'){h=header('飼育成果與資料備份','尺寸是核心成果；未輸入的重量或尺寸不會當成已量測資料。')+state.batches.map(b=>{let sizes=[...b.male,...b.female],mean=sizes.length?(sizes.reduce((a,c)=>a+c,0)/sizes.length).toFixed(1):'—';return `<div class="card"><b>${esc(b.code)}｜${esc(b.species)}</b><div class="grid"><div>存活率<div class="stat">${(100*b.alive/b.initial).toFixed(1)}%</div></div><div>最大尺寸<div class="stat">${sizes.length?Math.max(...sizes)+'mm':'—'}</div></div><div>平均尺寸<div class="stat">${mean}${sizes.length?'mm':''}</div></div><div>量測隻數<div class="stat">${sizes.length}</div></div></div><p class="muted">預估成本：${money(b.estimate)}｜羽化登記：${b.emergedCount??'尚未登記'} 隻</p>${link('sizes',b.id,'輸入／修改尺寸')}</div>`}).join('')+`<div class="card soft"><h3>資料備份</h3><p class="muted">這個展示版只有本機儲存。請下載 JSON 備份，以免更換手機或清除瀏覽器資料後遺失。</p><button class="primary" data-action="export">匯出 JSON 備份</button><label>匯入之前匯出的 JSON</label><input type="file" id="importFile" accept="application/json,.json"></div>`}
$('#main').innerHTML=h;}
function labelHtml(key){const [id,individual]=key.split('::'),b=by(state.batches,id);if(!b)return '';let hist=b.history.filter(x=>x.type==='換土'),future=b.stage==='蛹'||b.stage==='成蟲'?[]:b.schedule;return `<div id="printTarget" class="paper" style="margin:16px 0"><div class="row"><div><b style="font-size:18px">${esc(b.species)}</b><div>${esc(individual||b.code)}｜${esc(individual?(individual.includes('-M')?'公':'母'):b.sex)}</div><div>批次 ${esc(b.code)}｜${esc(b.stage)}</div></div><div style="font-size:12px;border:1px solid #888;padding:8px">QR 待串接<br>識別碼</div></div><h4>已完成換土歷史</h4><table><tr><th>實際日期</th><th>存活／死亡</th><th>重量</th></tr>${hist.map(x=>`<tr><td>${fmt(x.date)}</td><td>${x.alive}／${x.dead}</td><td>${x.weight?esc(x.weight)+' g':'—'}</td></tr>`).join('')||'<tr><td colspan="3">尚未回填</td></tr>'}</table><h4>預定換土／現場手寫</h4><table><tr><th>預定日期</th><th>完成</th><th>實際日期</th><th>重量 g</th></tr>${future.map(s=>`<tr><td>${fmt(s.date)}<br>${s.cc}cc／${s.temp}°C</td><td><span class="box"></span></td><td>____/____</td><td>________</td></tr>`).join('')||'<tr><td colspan="4">目前無幼蟲換土排程</td></tr>'}</table><div style="margin-top:12px;font-size:12px">化蛹日期：________　羽化日期：________</div><div style="margin-top:7px;font-size:10px">重量可手寫；事後有空再回填 App。批次共用紀錄不等於個體實測重量。</div></div>`}
function action(a,id){current=id||current;if(a==='cancel'){view='';render();return}if(a==='print'){window.print();return}if(a==='export'){const blob=new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),data:state},null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),x=document.createElement('a');x.href=u;x.download='甲蟲管理小幫手_備份_'+today()+'.json';x.click();setTimeout(()=>URL.revokeObjectURL(u),1000);return}if(a==='label'){selectedLabel=id;tab='labels';view='';render();return}view=a;render()}
$('#nav').addEventListener('click',ev=>{const el=ev.target.closest('[data-tab]');if(el){tab=el.dataset.tab;view='';render()}});$('#main').addEventListener('click',ev=>{const el=ev.target.closest('[data-action]');if(el&&!el.disabled)action(el.dataset.action,el.dataset.id)});$('#main').addEventListener('change',async ev=>{if(ev.target.id==='labelSelect'){selectedLabel=ev.target.value;render()}if(ev.target.id==='importFile'){const file=ev.target.files[0];if(!file)return;try{const obj=JSON.parse(await file.text());if(!obj.data||!Array.isArray(obj.data.plans)||!Array.isArray(obj.data.stock)||!Array.isArray(obj.data.batches))throw Error('格式不正確');if(confirm('匯入會覆蓋目前本機資料，確定嗎？')){state=obj.data;view='';tab='home';save()}}catch(e){alert('無法匯入：'+e.message)}}});
$('#main').addEventListener('submit',ev=>{ev.preventDefault();const f=ev.target,d=new FormData(f),get=k=>String(d.get(k)||'').trim(),num=k=>Number(d.get(k));try{
if(f.id==='newPlan'){const steps=get('steps').split(/\n/).map(x=>x.trim()).filter(Boolean).map(line=>{const a=line.split(/[,，]/).map(s=>s.trim());if(a.length<5||!Number.isFinite(+a[1])||+a[1]<0||+a[2]<=0)throw Error('階段格式錯誤：'+line);return {stage:a[0],days:+a[1],cc:+a[2],temp:+a[3],sex:a[4]}});state.plans.push({id:uid(),name:get('name'),version:get('version'),pupa:num('pupa'),price:num('price'),fill:num('fill'),wage:num('wage'),steps}) ;tab='plans'}
else if(f.id==='newStock'){state.stock.push({id:uid(),species:get('species'),date:get('date'),source:get('source'),count:num('count'),used:0,unit:num('unit')});tab='stock'}
else if(f.id==='newBatch'){const p=by(state.plans,get('plan')),s=by(state.stock,get('stock')),n=num('count');if(!p||!s||n<1||n>s.count-s.used)throw Error('請確認計畫及可用入庫數量');if(state.batches.some(b=>b.code===get('code')))throw Error('批次編號不可重複');const sex=get('sex'),steps=p.steps.filter(x=>x.sex==='共用'||sex==='未分公母'||x.sex===sex);let cursor=get('start');const schedule=steps.map(x=>{cursor=plus(cursor,x.days);return {...x,date:cursor}});const material=steps.reduce((sum,x)=>sum+n*x.cc/1000*p.fill/100*p.price,0);const b={id:uid(),code:get('code'),species:s.species,planSnapshot:JSON.parse(JSON.stringify(p)),stockId:s.id,sex,stage:'L1',start:get('start'),initial:n,alive:n,dead:0,schedule,history:[],pupated:'',pupaDays:p.pupa,emerged:'',emergedCount:null,male:[],female:[],individuals:[],estimate:Math.round(n*s.unit+material)};state.batches.push(b);s.used+=n;tab='batches'}
else{const b=by(state.batches,current);if(!b)throw Error('找不到批次');if(f.id==='record'){if(num('alive')+num('dead')!==b.alive)throw Error('存活數＋死亡數必須等於換土前數量');b.alive=num('alive');b.dead+=num('dead');b.history.push({type:'換土',date:get('date'),alive:b.alive,dead:num('dead'),weight:get('weight')});if(b.schedule.length){const first=b.schedule.shift();let date=get('date');b.schedule=b.schedule.map(s=>{date=plus(date,s.days);return {...s,date}});b.stage=first.stage}}
if(f.id==='pupate'){b.stage='蛹';b.pupated=get('date');b.pupaDays=num('days');b.schedule=[];b.history.push({type:'化蛹',date:get('date')})}
if(f.id==='emerge'){b.stage='成蟲';b.emerged=get('date');b.emergedCount=num('count');b.schedule=[];b.history.push({type:'羽化',date:get('date')})}
if(f.id==='sizes'){const parse=s=>s.trim()?s.trim().split(/[\s,，、;；]+/).map(Number):[];const male=parse(get('male')),female=parse(get('female'));if([...male,...female].some(x=>!Number.isFinite(x)||x<=0||x>200))throw Error('尺寸須為有效的 mm 數字');b.male=male;b.female=female}
if(f.id==='sex'){const m=num('male'),fe=num('female');if(m+fe!==b.alive)throw Error('公蟲＋母蟲必須等於目前存活數');b.sex='已分公母';b.individuals=[...Array.from({length:m},(_,i)=>b.code+'-M'+String(i+1).padStart(3,'0')),...Array.from({length:fe},(_,i)=>b.code+'-F'+String(i+1).padStart(3,'0'))];b.history.push({type:'分公母',date:today()})}
tab='batches'}view='';save();}catch(e){alert(e.message)}});render();})();
</script></body></html>
